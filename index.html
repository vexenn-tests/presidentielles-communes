<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Présidentielles par commune</title>
<style>
:root{--ink:#141414;--muted:#5a5a5a;--line:#e3e3e0;--soft:#f1f1ef;--ok:#1b6b37;--okbg:#e3f3e8;--link:#4742FF}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px}
.count{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px;color:#4a4a4a;margin:0 0 16px}
.count .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.count strong{color:var(--ink)}

/* Recherche */
.sbox{position:relative;margin-bottom:14px}
.search{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:14px;padding:0 8px 0 16px;height:56px;background:#fff}
.search:focus-within{box-shadow:0 0 0 3px rgba(71,66,255,.25)}
.search svg{flex:none}
.search input{flex:1 1 auto;min-width:0;border:0;outline:none;font:inherit;font-size:17px;color:var(--ink);background:transparent;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:40px;height:40px;border-radius:50%;border:0;background:#ececea;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 40px;font-size:18px}
.clear[hidden]{display:none}
.sugg{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);list-style:none;margin:0;padding:6px;max-height:420px;overflow:auto}
.sugg li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--soft)}
.sugg .nm{font-weight:700}
.sugg .al{color:var(--muted);font-size:13px}
.sugg .meta{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.sugg .empty{color:var(--muted);cursor:default}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid #d8d8d3;background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--ink)}

/* Fiche commune */
.place{margin:22px 0 16px}
.place h2{font-size:30px;line-height:1.15;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:#3a3a3a;display:inline-flex;align-items:center;gap:6px}
.tag.yr{background:var(--ink);color:#fff;font-size:13px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* Cartes scrutins */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.id{display:flex;align-items:center;gap:14px;padding-left:4px}
.id + .id{border-top:1px solid #ececea;padding-top:14px}
.av{position:relative;width:64px;height:64px;border-radius:50%;flex:0 0 64px;color:#fff;font-weight:700;font-size:20px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--fc);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--fc)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
.who{min-width:0;flex:1}
.nm{font-size:18px;font-weight:700;margin:0;line-height:1.2}
.pt{font-size:13px;color:var(--muted);margin:2px 0 0}
.pt .pd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--fc)}
.pc{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc small{font-size:14px;font-weight:600;color:var(--muted)}
.na{color:var(--muted);font-size:14px}

/* Frise chronologique */
.tl{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);padding:22px 28px 22px 16px;overflow:hidden}
.rail{display:flex;flex-direction:column;flex:0 0 74px}
.rail span{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center}
.rail .r1,.rail .r2{flex:1}
.rail .ra{height:46px}
.step{flex:1;min-width:0;display:flex;flex-direction:column;animation:walk .5s ease-out both;animation-delay:calc(var(--i) * .35s)}
.slot{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 6px}
.slot .av{width:58px;height:58px;flex:0 0 58px;font-size:18px}
.slot .nm{font-size:15px;margin-top:4px}
.slot .pc{font-size:21px}
.slot .tr{display:none}
.slot.na{justify-content:center;color:var(--muted);font-size:13px}
.axis{position:relative;height:46px;display:flex;align-items:center;justify-content:center}
.axis::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;
  background:linear-gradient(to right,var(--prev) 50%,var(--seg) 50%)}
.rail + .step .axis::before{left:50%;background:var(--seg)}
.step:last-child .axis::before{right:-14px}
.step:last-child .axis::after{content:"";position:absolute;right:-28px;top:50%;margin-top:-11px;
  border-left:16px solid var(--seg);border-top:11px solid transparent;border-bottom:11px solid transparent}
.yr{position:relative;z-index:1;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;box-shadow:0 0 0 4px #fff}
@keyframes walk{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}}
@media (max-width:700px){
  .tl{flex-direction:column;padding:12px 16px 28px}
  .rail{display:none}
  .step{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);align-items:center}
  .axis{order:-1;height:auto;align-self:stretch;min-height:150px}
  .axis::before{left:50%;right:auto;top:0;bottom:0;width:6px;height:auto;margin:0 0 0 -3px;
    background:linear-gradient(to bottom,var(--prev) 50%,var(--seg) 50%)}
  .rail + .step .axis::before{left:50%;top:50%;background:var(--seg)}
  .step:last-child .axis::before{right:auto;bottom:-14px}
  .step:last-child .axis::after{right:auto;left:50%;top:auto;bottom:-28px;margin:0 0 0 -11px;
    border-left:11px solid transparent;border-right:11px solid transparent;border-top:16px solid var(--seg);border-bottom:0}
  .slot .tr{display:block;font-size:12px;font-weight:700;color:var(--muted)}
  @keyframes walk{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
}

.empty{background:#fff;border:1px dashed #cfcfcb;border-radius:16px;padding:32px;text-align:center;font-size:15px;color:#4a4a4a}
.foot{font-size:12px;color:#777;margin-top:22px;line-height:1.5}
.foot a{color:var(--link)}
@media (max-width:560px){.grid{grid-template-columns:1fr}.place h2{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sbox">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Nom de commune ou code postal"
        aria-label="Rechercher une commune" role="combobox" aria-controls="sugg" aria-expanded="false">
      <button class="clear" id="clear" type="button" aria-label="Effacer" hidden>×</button>
    </div>
    <ul id="sugg" class="sugg" role="listbox" hidden></ul>
  </div>

  <main id="out"></main>
  <div class="foot" id="foot"></div>
</div>

<script src="data/index.js"></script>
<script>
(function(){
  "use strict";
  const P = window.PRESID;
  const $ = s => document.querySelector(s);
  const out = $("#out"), q = $("#q"), sugg = $("#sugg"), clear = $("#clear"), foot = $("#foot");
  if(!P){ out.innerHTML = '<div class="empty">Le fichier data/index.js est introuvable. Lancez « py scripts/build.py ».</div>'; return; }

  const fmt = n => n.toLocaleString("fr-FR");
  const pct = (a,b) => b ? 100*a/b : 0;
  const f1 = x => x.toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
      .replace(/[-'’_.,()]/g," ").replace(/\bste\b/g,"sainte").replace(/\bst\b/g,"saint").replace(/\s+/g," ").trim();

  const C = P.communes.map(c => ({code:c[0], name:c[1], dep:c[2], cps:c[3] ? c[3].split(" ") : [],
      aliases:c[4] ? c[4].split("|") : [], n:norm(c[1]), na:c[4] ? c[4].split("|").map(norm) : []}));
  const byCode = new Map(C.map(c => [c.code, c]));
  const depName = d => P.deps[d] || d;

  // ---------- Photos : lues dans un Google Sheet public (colonne A = candidat, colonne B = lien photo) ----------
  // Pour changer une photo, modifier le Sheet ; la page le relit à chaque ouverture.
  const PHOTOS_SHEET_ID = "1N-dbDOiFGGg1x6V_A7XeShdCvwKf35gGI4WCIUQBU_8";
  const PHOTOS = {};
  window.__presidPhotos = resp => {
    try {
      for(const r of (resp.table && resp.table.rows) || []){
        const n = r.c && r.c[0] && r.c[0].v, u = r.c && r.c[1] && r.c[1].v;
        if(n && u && /^https?:\/\//i.test(String(u).trim())) PHOTOS[String(n).trim()] = String(u).trim();
      }
    } catch(e) {}
    if(location.hash.length > 1) route();
  };
  (function loadPhotos(){
    const s = document.createElement("script");
    s.src = "https://docs.google.com/spreadsheets/d/" + PHOTOS_SHEET_ID + "/gviz/tq?tqx=out:json;responseHandler:__presidPhotos&_=" + Date.now();
    s.onerror = () => {};  // hors ligne : on garde les initiales
    document.head.appendChild(s);
  })();
  const years = [...new Set(P.elections.map(e => e.annee))];

  // ---------- Recherche ----------
  function search(raw){
    const s = norm(raw);
    if(!s) return [];
    if(/^\d{2,5}$/.test(s) || /^(2a|2b)\d{0,3}$/.test(s)){
      const r = [];
      for(const c of C){
        if(c.code.toLowerCase() === s){ r.unshift({c, why:"Code INSEE"}); continue; }
        const cp = c.cps.find(x => x.startsWith(s));
        if(cp) r.push({c, why:cp, exact: cp === s});
      }
      r.sort((a,b) => (b.exact|0)-(a.exact|0) || (a.why > b.why ? 1 : -1) || a.c.n.localeCompare(b.c.n));
      return r.slice(0,30);
    }
    const scored = [];
    for(const c of C){
      let sc = 0, al = null;
      if(c.n === s) sc = 100;
      else if(c.n.startsWith(s)) sc = 80;
      else if((" "+c.n).includes(" "+s)) sc = 60;
      else if(c.n.includes(s)) sc = 40;
      else {
        for(let i=0;i<c.na.length;i++){
          const a = c.na[i];
          if(a === s || a.startsWith(s) || (" "+a).includes(" "+s)){ sc = a === s ? 50 : 30; al = c.aliases[i]; break; }
        }
      }
      if(sc) scored.push({c, sc, al});
    }
    scored.sort((a,b) => b.sc-a.sc || a.c.n.length-b.c.n.length || a.c.n.localeCompare(b.c.n));
    return scored.slice(0,30);
  }

  let items = [], sel = -1;
  function openSugg(open){ sugg.hidden = !open; q.setAttribute("aria-expanded", open); }
  function renderSugg(){
    const v = q.value;
    clear.hidden = !v;
    items = search(v);
    sel = items.length ? 0 : -1;
    if(!v.trim()){ openSugg(false); return; }
    if(!items.length){ sugg.innerHTML = '<li class="empty">Aucune commune trouvée</li>'; openSugg(true); return; }
    sugg.innerHTML = items.map((it,i) => {
      const c = it.c;
      const meta = (it.why && it.why !== "Code INSEE" ? it.why + " · " : "") + depName(c.dep) + " (" + c.dep + ")";
      const al = it.al ? ' <span class="al">ex-' + esc(it.al) + '</span>' : "";
      return '<li role="option" data-i="'+i+'" aria-selected="'+(i===sel)+'"><span class="nm">'+esc(c.name)+'</span>'+al+'<span class="meta">'+esc(meta)+'</span></li>';
    }).join("");
    openSugg(true);
  }
  function move(d){
    if(!items.length) return;
    sel = (sel + d + items.length) % items.length;
    sugg.querySelectorAll("li").forEach((li,i) => li.setAttribute("aria-selected", i===sel));
    const li = sugg.children[sel]; if(li) li.scrollIntoView({block:"nearest"});
  }
  function pick(i){
    const it = items[i]; if(!it) return;
    openSugg(false); q.value = it.c.name; clear.hidden = false; q.blur();
    location.hash = it.c.code;
  }
  q.addEventListener("input", renderSugg);
  q.addEventListener("focus", () => { if(q.value.trim()) renderSugg(); });
  q.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); move(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
    else if(e.key === "Enter"){ e.preventDefault(); if(sugg.hidden) renderSugg(); pick(sel < 0 ? 0 : sel); }
    else if(e.key === "Escape"){ openSugg(false); }
  });
  sugg.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if(li){ e.preventDefault(); pick(+li.dataset.i); }});
  document.addEventListener("click", e => { if(!e.target.closest(".sbox")) openSugg(false); });
  clear.addEventListener("click", () => { q.value = ""; clear.hidden = true; openSugg(false); q.focus(); history.replaceState(null, "", location.pathname); welcome(); });

  // ---------- Données par département (chargées à la demande, fonctionne en file://) ----------
  const depCache = {}, depWait = {};
  window.PRESID_DEP = (d, rows) => { depCache[d] = rows; (depWait[d] || []).forEach(f => f(rows)); delete depWait[d]; };
  function loadDep(d){
    if(depCache[d]) return Promise.resolve(depCache[d]);
    return new Promise((res, rej) => {
      if(depWait[d]){ depWait[d].push(res); return; }
      depWait[d] = [res];
      const s = document.createElement("script");
      s.src = "data/dep/" + encodeURIComponent(d) + ".js";
      s.onerror = () => { delete depWait[d]; rej(new Error("dep " + d)); };
      document.head.appendChild(s);
    });
  }

  // ---------- Affichage ----------
  function winner(ei, rec){
    const E = P.elections[ei]; let best = 0;
    for(let j = 1; j < E.cands.length; j++) if(rec[3+j] > rec[3+best]) best = j;
    const c = E.cands[best];
    return {n: c.n, c: c.c, photo: PHOTOS[c.n] || null, pc: pct(rec[3+best], rec[2]), v: rec[3+best]};
  }
  const initials = n => n.split(/[\s-]+/).filter(w => /^[A-ZÉ]/.test(w)).map(w => w[0]).slice(0,2).join("");

  function idRow(ei, rec, label, used){
    if(!rec || !rec[2]) return '<div class="id"><span class="na">'+label+' : pas de données</span></div>';
    const w = winner(ei, rec);
    if(w.photo) used.add(w.n);
    const av = w.photo ? '<img src="'+esc(w.photo)+'" alt="" loading="lazy" onerror="this.remove()">' : "";
    return '<div class="id" style="--fc:'+w.c+'" title="'+esc(w.n)+' : '+fmt(w.v)+' voix sur '+fmt(rec[2])+' exprimés · participation '+f1(pct(rec[1],rec[0]))+' %">'
      + '<div class="av">'+initials(w.n)+av+'</div>'
      + '<div class="who"><p class="nm">'+esc(w.n)+'</p><p class="pt"><span class="pd"></span>'+label+'</p></div>'
      + '<div class="pc">'+f1(w.pc)+'<small> %</small></div></div>';
  }

  function slot(ei, rec, label, used){
    if(!rec || !rec[2]) return '<div class="slot na"><span class="tr">'+label+'</span>pas de données</div>';
    const w = winner(ei, rec);
    if(w.photo) used.add(w.n);
    const av = w.photo ? '<img src="'+esc(w.photo)+'" alt="" loading="lazy" onerror="this.remove()">' : "";
    const last = w.n.replace(/^(Jean-Marie|Jean-Luc|Jean-Pierre|Marie-George|\S+)\s+/, "");
    return '<div class="slot" style="--fc:'+w.c+'" title="'+esc(w.n)+' : '+fmt(w.v)+' voix sur '+fmt(rec[2])+' exprimés · participation '+f1(pct(rec[1],rec[0]))+' %">'
      + '<span class="tr">'+label+'</span>'
      + '<div class="av">'+initials(w.n)+av+'</div>'
      + '<p class="nm">'+esc(last)+'</p>'
      + '<div class="pc">'+f1(w.pc)+'<small> %</small></div></div>';
  }

  function setFoot(){
    foot.innerHTML = "Sources : " + esc(P.source) + ". Pourcentages des suffrages exprimés ; voix et participation au survol.";
  }

  async function show(code){
    const c = byCode.get(code);
    if(!c){ welcome(); return; }
    document.title = c.name + " · Présidentielles";
    let data;
    try { data = await loadDep(c.dep); }
    catch(e){ out.innerHTML = '<div class="empty">Impossible de charger data/dep/'+esc(c.dep)+'.js</div>'; return; }
    const recs = data[code] || [];
    const used = new Set();
    let h = '<section class="place"><h2>'+esc(c.name)+'</h2><div class="tags">'
      + '<span class="tag">'+esc(depName(c.dep))+' ('+esc(c.dep)+')</span>'
      + (c.cps.length ? '<span class="tag">CP '+esc(c.cps.slice(0,6).join(", "))+(c.cps.length > 6 ? '…' : '')+'</span>' : '')
      + '<span class="tag">INSEE '+esc(c.code)+'</span></div>';
    if(c.aliases.length) h += '<p class="note">Territoire actuel, résultats des anciennes communes additionnés : '+esc(c.aliases.join(", "))+'.</p>';
    if(["75056","69123","13055"].includes(c.code)) h += '<p class="note">Résultats pour la ville entière (tous arrondissements).</p>';
    h += '</section><div class="tl"><div class="rail"><span class="r1">1<sup>er</sup>&nbsp;tour</span><span class="ra"></span><span class="r2">2<sup>nd</sup>&nbsp;tour</span></div>';
    let prev = "#ddd";
    for(let y = 0; y < years.length; y++){
      const r2 = recs[2*y+1], seg = r2 && r2[2] ? winner(2*y+1, r2).c : "#ddd";
      h += '<div class="step" style="--i:'+y+';--seg:'+seg+';--prev:'+prev+'">';
      prev = seg;
      h += ''
        + slot(2*y, recs[2*y], "1<sup>er</sup> tour", used)
        + '<div class="axis"><span class="yr">'+years[y]+'</span></div>'
        + slot(2*y+1, r2, "2<sup>nd</sup> tour", used) + '</div>';
    }
    out.innerHTML = h + '</div>';
    setFoot(used);
  }

  function welcome(){
    document.title = "Présidentielles par commune";
    const ex = [["75056","Paris"],["13055","Marseille"],["69123","Lyon"],["74010","Annecy"],["59350","Lille"],["2A004","Ajaccio"]];
    out.innerHTML = '<div class="chips">' + ex.filter(e => byCode.has(e[0]))
      .map(e => '<button class="chip" data-c="'+e[0]+'">'+e[1]+'</button>').join("") + '</div>';
    out.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => location.hash = b.dataset.c));
    setFoot();
  }

  function route(){
    const code = decodeURIComponent(location.hash.slice(1));
    if(code && byCode.has(code)){ const c = byCode.get(code); if(document.activeElement !== q){ q.value = c.name; clear.hidden = false; } show(code); }
    else welcome();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
