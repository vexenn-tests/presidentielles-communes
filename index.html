<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Présidentielles par commune</title>
<style>
:root{--ink:#141414;--muted:#5a5a5a;--line:#e3e3e0;--soft:#f1f1ef;--ok:#1b6b37;--okbg:#e3f3e8;--link:#4742FF}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px}
.count{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px;color:#4a4a4a;margin:0 0 16px}
.count .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.count strong{color:var(--ink)}

/* Recherche */
.sbox{position:relative;margin-bottom:14px}
.search{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:14px;padding:0 8px 0 16px;height:56px;background:#fff}
.search:focus-within{box-shadow:0 0 0 3px rgba(71,66,255,.25)}
.search svg{flex:none}
.search input{flex:1 1 auto;min-width:0;border:0;outline:none;font:inherit;font-size:17px;color:var(--ink);background:transparent;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:40px;height:40px;border-radius:50%;border:0;background:#ececea;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 40px;font-size:18px}
.clear[hidden]{display:none}
.sugg{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);list-style:none;margin:0;padding:6px;max-height:420px;overflow:auto}
.sugg li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--soft)}
.sugg .nm{font-weight:700}
.sugg .al{color:var(--muted);font-size:13px}
.sugg .meta{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.sugg .empty{color:var(--muted);cursor:default}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips-l{font-size:14px;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid #d8d8d3;background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--ink)}

/* Fiche commune */
.place{margin:22px 0 16px}
.place h2{font-size:30px;line-height:1.15;margin:0 0 10px}
.place h2 .dep{font-size:18px;font-weight:400;color:var(--muted);margin-left:6px;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.rl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:14px 18px;
  border:2px solid #4742ff;border-radius:12px;color:#4742ff;text-decoration:none;font-weight:700;font-size:15px;transition:background .15s,color .15s}
.rl:hover,.rl:focus-visible{background:#4742ff;color:#fff}
.rl-s{font-weight:400;font-size:20px;line-height:1}
.key{font-size:14px;color:var(--muted);margin:0 0 12px}

/* Photo ronde avec anneau de la couleur du camp */
.av{position:relative;width:44px;height:44px;border-radius:50%;flex:0 0 44px;color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--fc);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--fc)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
.na{color:var(--muted);font-size:14px}

/* Tableau des résultats */
.tblw{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
table.res{width:100%;border-collapse:collapse}
.res th{text-align:left;font-size:13px;font-weight:700;color:var(--muted);padding:14px 18px;border-bottom:2px solid var(--ink);background:#fff}
.res td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
.res tbody tr:last-child td{border-bottom:0}
.res .ty{font-size:24px;font-weight:700;width:130px;position:relative;padding-left:58px}

/* Frise verticale dans la colonne Année */
.rail{position:absolute;left:26px;top:0;bottom:0;width:6px;background:linear-gradient(to bottom,var(--prev) 50%,var(--seg) 50%)}
.rail.first{top:50%;background:var(--seg)}
.rail.last{bottom:14px}
.rail::after{content:"";position:absolute;left:-6px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;
  background:#fff;border:4px solid var(--seg);box-sizing:border-box;animation:pop .35s ease-out both;animation-delay:calc(var(--i) * .15s)}
.rail.first::after{top:0}
.arr{position:absolute;left:20px;bottom:0;border-top:14px solid var(--seg);border-left:9px solid transparent;border-right:9px solid transparent}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rail::after{animation:none}}
.res .elu-c,.res .elu-h{background:var(--soft)}
.tc{display:flex;align-items:center;gap:12px}
.nm2{font-weight:700;font-size:15px}
.tp{font-size:20px;font-weight:700;line-height:1.1;margin-top:2px}

@media (max-width:700px){
  .place h2{font-size:26px}
  .res thead{display:none}
  .res, .res tbody{display:block;width:100%}
  .res tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-bottom:1px solid var(--line);padding:12px 12px 14px 48px;position:relative}
  .res .ty{position:static;padding-left:0}
  .rail{left:20px;background:linear-gradient(to bottom,var(--prev) 26px,var(--seg) 26px)}
  .rail.first{top:26px}
  .rail::after{top:26px}
  .rail.first::after{top:0}
  .arr{left:14px}
  .res tbody tr:last-child{border-bottom:0}
  .res td{display:block;border:0;padding:0;min-width:0}
  .res td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.2}
  .res .ty{grid-column:1/-1;font-size:20px;width:auto;margin-bottom:4px}
  .res .elu-c{border-radius:10px;padding:6px}
  .res .tc{flex-direction:column;align-items:flex-start;gap:6px}
  .res .av{width:38px;height:38px;flex:0 0 38px;font-size:12px}
  .res .nm2{font-size:13px}
  .res .tp{font-size:16px}
}

/* Encart newsletter 2027 */
.nl{position:relative;overflow:hidden;margin-top:22px;border-radius:16px;background:#101d25;color:#fff;
  padding:26px 28px;display:flex;align-items:center;gap:24px;justify-content:space-between}
.nl-txt{position:relative;z-index:1;max-width:620px}
.nl-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  background:#4742ff;color:#fff;border-radius:999px;padding:4px 10px}
.nl-t{font-size:24px;font-weight:700;line-height:1.2;margin:12px 0 6px}
.nl-d{font-size:15px;line-height:1.45;margin:0;color:#c9d0d8}
.nl-btn{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:8px;background:#4742ff;color:#fff;
  font-weight:700;font-size:15px;text-decoration:none;padding:14px 20px;border-radius:999px;transition:background .15s,transform .15s}
.nl-btn:hover{background:#6b72fb;transform:translateY(-1px)}
.nl-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.nl-bg{position:absolute;right:-10px;bottom:-38px;font-size:150px;font-weight:700;line-height:1;color:#fff;opacity:.06;
  letter-spacing:-.04em;pointer-events:none}
@media (max-width:700px){
  .nl{flex-direction:column;align-items:flex-start;padding:22px 20px}
  .nl-t{font-size:20px}
  .nl-btn{width:100%;justify-content:center}
  .nl-bg{font-size:110px}
}

.empty{background:#fff;border:1px dashed #cfcfcb;border-radius:16px;padding:32px;text-align:center;font-size:15px;color:#4a4a4a}
.foot{font-size:12px;color:#777;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="sbox">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Tapez le nom de votre commune ou son code postal"
        aria-label="Rechercher une commune" role="combobox" aria-controls="sugg" aria-expanded="false">
      <button class="clear" id="clear" type="button" aria-label="Effacer" hidden>×</button>
    </div>
    <ul id="sugg" class="sugg" role="listbox" hidden></ul>
  </div>

  <main id="out"></main>
  <div class="foot" id="foot"></div>
</div>

<script src="data/index.js"></script>
<script src="data/liens20min.js"></script>
<script>
(function(){
  "use strict";
  const P = window.PRESID;
  const $ = s => document.querySelector(s);
  const out = $("#out"), q = $("#q"), sugg = $("#sugg"), clear = $("#clear"), foot = $("#foot");
  if(!P){ out.innerHTML = '<div class="empty">Le fichier data/index.js est introuvable. Lancez « py scripts/build.py ».</div>'; return; }

  const fmt = n => n.toLocaleString("fr-FR");
  const pct = (a,b) => b ? 100*a/b : 0;
  const f1 = x => x.toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
      .replace(/[-'’_.,()]/g," ").replace(/\bste\b/g,"sainte").replace(/\bst\b/g,"saint").replace(/\s+/g," ").trim();

  const C = P.communes.map(c => ({code:c[0], name:c[1], dep:c[2], cps:c[3] ? c[3].split(" ") : [],
      aliases:c[4] ? c[4].split("|") : [], n:norm(c[1]), na:c[4] ? c[4].split("|").map(norm) : []}));
  const byCode = new Map(C.map(c => [c.code, c]));
  const depName = d => P.deps[d] || d;

  // ---------- Photos : lues dans un Google Sheet public (colonne A = candidat, colonne B = lien photo) ----------
  // Pour changer une photo, modifier le Sheet ; la page le relit à chaque ouverture.
  const PHOTOS_SHEET_ID = "1N-dbDOiFGGg1x6V_A7XeShdCvwKf35gGI4WCIUQBU_8";
  const PHOTOS = {};
  window.__presidPhotos = resp => {
    try {
      for(const r of (resp.table && resp.table.rows) || []){
        const n = r.c && r.c[0] && r.c[0].v, u = r.c && r.c[1] && r.c[1].v;
        if(n && u && /^https?:\/\//i.test(String(u).trim())) PHOTOS[String(n).trim()] = String(u).trim();
      }
    } catch(e) {}
    if(location.hash.length > 1) route();
  };
  (function loadPhotos(){
    const s = document.createElement("script");
    s.src = "https://docs.google.com/spreadsheets/d/" + PHOTOS_SHEET_ID + "/gviz/tq?tqx=out:json;responseHandler:__presidPhotos&_=" + Date.now();
    s.onerror = () => {};  // hors ligne : on garde les initiales
    document.head.appendChild(s);
  })();
  const years = [...new Set(P.elections.map(e => e.annee))];

  // ---------- Recherche ----------
  function search(raw){
    const s = norm(raw);
    if(!s) return [];
    if(/^\d{2,5}$/.test(s) || /^(2a|2b)\d{0,3}$/.test(s)){
      const r = [];
      for(const c of C){
        if(c.code.toLowerCase() === s){ r.unshift({c, why:"Code INSEE"}); continue; }
        const cp = c.cps.find(x => x.startsWith(s));
        if(cp) r.push({c, why:cp, exact: cp === s});
      }
      r.sort((a,b) => (b.exact|0)-(a.exact|0) || (a.why > b.why ? 1 : -1) || a.c.n.localeCompare(b.c.n));
      return r.slice(0,30);
    }
    const scored = [];
    for(const c of C){
      let sc = 0, al = null;
      if(c.n === s) sc = 100;
      else if(c.n.startsWith(s)) sc = 80;
      else if((" "+c.n).includes(" "+s)) sc = 60;
      else if(c.n.includes(s)) sc = 40;
      else {
        for(let i=0;i<c.na.length;i++){
          const a = c.na[i];
          if(a === s || a.startsWith(s) || (" "+a).includes(" "+s)){ sc = a === s ? 50 : 30; al = c.aliases[i]; break; }
        }
      }
      if(sc) scored.push({c, sc, al});
    }
    scored.sort((a,b) => b.sc-a.sc || a.c.n.length-b.c.n.length || a.c.n.localeCompare(b.c.n));
    return scored.slice(0,30);
  }

  let items = [], sel = -1;
  function openSugg(open){ sugg.hidden = !open; q.setAttribute("aria-expanded", open); }
  function renderSugg(){
    const v = q.value;
    clear.hidden = !v;
    items = search(v);
    sel = items.length ? 0 : -1;
    if(!v.trim()){ openSugg(false); return; }
    if(!items.length){ sugg.innerHTML = '<li class="empty">Aucune commune trouvée</li>'; openSugg(true); return; }
    sugg.innerHTML = items.map((it,i) => {
      const c = it.c;
      const meta = (it.why && it.why !== "Code INSEE" ? it.why + " · " : "") + depName(c.dep) + " (" + c.dep + ")";
      const al = it.al ? ' <span class="al">ex-' + esc(it.al) + '</span>' : "";
      return '<li role="option" data-i="'+i+'" aria-selected="'+(i===sel)+'"><span class="nm">'+esc(c.name)+'</span>'+al+'<span class="meta">'+esc(meta)+'</span></li>';
    }).join("");
    openSugg(true);
  }
  function move(d){
    if(!items.length) return;
    sel = (sel + d + items.length) % items.length;
    sugg.querySelectorAll("li").forEach((li,i) => li.setAttribute("aria-selected", i===sel));
    const li = sugg.children[sel]; if(li) li.scrollIntoView({block:"nearest"});
  }
  function pick(i){
    const it = items[i]; if(!it) return;
    openSugg(false); q.value = it.c.name; clear.hidden = false; q.blur();
    location.hash = it.c.code;
  }
  q.addEventListener("input", renderSugg);
  q.addEventListener("focus", () => { if(q.value.trim()) renderSugg(); });
  q.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); move(1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
    else if(e.key === "Enter"){ e.preventDefault(); if(sugg.hidden) renderSugg(); pick(sel < 0 ? 0 : sel); }
    else if(e.key === "Escape"){ openSugg(false); }
  });
  sugg.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if(li){ e.preventDefault(); pick(+li.dataset.i); }});
  document.addEventListener("click", e => { if(!e.target.closest(".sbox")) openSugg(false); });
  clear.addEventListener("click", () => { q.value = ""; clear.hidden = true; openSugg(false); q.focus(); history.replaceState(null, "", location.pathname); welcome(); });

  // ---------- Données par département (chargées à la demande, fonctionne en file://) ----------
  const depCache = {}, depWait = {};
  window.PRESID_DEP = (d, rows) => { depCache[d] = rows; (depWait[d] || []).forEach(f => f(rows)); delete depWait[d]; };
  function loadDep(d){
    if(depCache[d]) return Promise.resolve(depCache[d]);
    return new Promise((res, rej) => {
      if(depWait[d]){ depWait[d].push(res); return; }
      depWait[d] = [res];
      const s = document.createElement("script");
      s.src = "data/dep/" + encodeURIComponent(d) + ".js";
      s.onerror = () => { delete depWait[d]; rej(new Error("dep " + d)); };
      document.head.appendChild(s);
    });
  }

  // ---------- Affichage ----------
  function winner(ei, rec){
    const E = P.elections[ei]; let best = 0;
    for(let j = 1; j < E.cands.length; j++) if(rec[3+j] > rec[3+best]) best = j;
    const c = E.cands[best];
    return {n: c.n, c: c.c, photo: PHOTOS[c.n] || null, pc: pct(rec[3+best], rec[2]), v: rec[3+best]};
  }
  const initials = n => n.split(/[\s-]+/).filter(w => /^[A-ZÉ]/.test(w)).map(w => w[0]).slice(0,2).join("");

  function setFoot(){
    foot.innerHTML = "Sources : data.gouv.fr — Données des élections agrégées (Ministère de l’Intérieur)";
  }

  async function show(code){
    const c = byCode.get(code);
    if(!c){ welcome(); return; }
    document.title = c.name + " · Présidentielles";
    let data;
    try { data = await loadDep(c.dep); }
    catch(e){ out.innerHTML = '<div class="empty">Impossible de charger data/dep/'+esc(c.dep)+'.js</div>'; return; }
    const recs = data[code] || [];
    let h = '<section class="place"><h2>'+esc(c.name)+' <span class="dep">'+esc(depName(c.dep))+' ('+esc(c.dep)+')</span></h2>';
    if(c.aliases.length) h += '<p class="note">Territoire actuel, résultats des anciennes communes additionnés : '+esc(c.aliases.join(", "))+'.</p>';
    if(["75056","69123","13055"].includes(c.code)) h += '<p class="note">Résultats pour la ville entière (tous arrondissements).</p>';
    h += '</section>' + renderTableau(c, recs) + resultsLink(c) + newsletterCTA(c);
    out.innerHTML = h;
    setFoot();
  }

  // ---------- Lien vers la page résultats de 20minutes.fr ----------
  // Pages tirées du plan de site élections de 20 Minutes (data/liens20min.js, généré par scripts/liens_20min.py).
  // Pas de page pour la commune → pas de lien.
  function resultsLink(c){
    const p = (window.LIENS20 || {})[c.code];
    if(!p) return "";
    const u = "https://www.20minutes.fr/elections/resultats/" + p + "?annee=2027&amp;scrutin=presidentielle";
    return '<a class="rl" href="'+u+'" target="_blank" rel="noopener">'
      + '<span class="rl-t">Les résultats détaillés du dernier scrutin à '+esc(c.name)+'</span>'
      + '<span class="rl-s" aria-hidden="true">→</span></a>';
  }

  // ---------- Encart newsletter (affiché seulement avec les résultats d'une commune) ----------
  // À remplacer par l'URL exacte de la page d'inscription à la newsletter politique.
  const NEWSLETTER_URL = "https://www.20minutes.fr/politique/";
  function newsletterCTA(c){
    return '<aside class="nl" aria-label="Newsletter politique">'
      + '<div class="nl-txt"><span class="nl-tag">Présidentielle 2027</span>'
      + '<p class="nl-t">Et en 2027, comment votera '+esc(c.name)+' ?</p>'
      + '<p class="nl-d">Candidats, sondages, programmes : suivez la campagne présidentielle avec la newsletter politique de 20 Minutes.</p></div>'
      + '<a class="nl-btn" href="'+NEWSLETTER_URL+'" target="_blank" rel="noopener">Je m’inscris à la newsletter <span aria-hidden="true">→</span></a>'
      + '<span class="nl-bg" aria-hidden="true">2027</span></aside>';
  }

  // ---------- Tableau des résultats ----------
  const ok = r => r && r[2];
  function avatar(w){
    const img = w.photo ? '<img src="'+esc(w.photo)+'" alt="" loading="lazy" onerror="this.remove()">' : "";
    return '<div class="av sm" style="--fc:'+w.c+'">'+initials(w.n)+img+'</div>';
  }
  function tcell(ei, rec, label, cls){
    const a = cls ? ' class="'+cls+'"' : '';
    if(!ok(rec)) return '<td'+a+' data-l="'+label+'"><span class="na">—</span></td>';
    const w = winner(ei, rec);
    return '<td'+a+' data-l="'+label+'" title="'+esc(w.n)+' : '+fmt(w.v)+' voix"><div class="tc">'+avatar(w)
      + '<div><div class="nm2">'+esc(w.n)+'</div><div class="tp">'+f1(w.pc)+' %</div></div></div></td>';
  }
  function renderTableau(c, recs){
    let h = '<p class="key">Candidat arrivé en tête à '+esc(c.name)+' à chaque présidentielle, et président élu. '
      + 'La couleur de la frise suit le vainqueur du 2<sup>nd</sup> tour à '+esc(c.name)+'.</p>'
      + '<div class="tblw"><table class="res"><thead><tr><th>Année</th><th>1<sup>er</sup> tour à '+esc(c.name)+'</th>'
      + '<th>2<sup>nd</sup> tour à '+esc(c.name)+'</th><th class="elu-h">Président élu</th></tr></thead><tbody>';
    let prev = "#ddd";
    for(let y = 0; y < years.length; y++){
      const r2 = recs[2*y+1], seg = ok(r2) ? winner(2*y+1, r2).c : "#ddd";
      const first = y === 0, last = y === years.length - 1;
      h += '<tr style="--seg:'+seg+';--prev:'+prev+';--i:'+y+'"><td class="ty">'
        + '<span class="rail'+(first ? ' first' : '')+(last ? ' last' : '')+'"></span>'
        + (last ? '<span class="arr"></span>' : '') + years[y] + '</td>';
      prev = seg;
      h += ''
        + tcell(2*y, recs[2*y], "1er tour à "+esc(c.name))
        + tcell(2*y+1, recs[2*y+1], "2nd tour à "+esc(c.name))
        + tcell(2*y+1, P.elections[2*y+1].nat, "Président élu", "elu-c") + '</tr>';
    }
    return h + '</tbody></table></div>';
  }

  function welcome(){
    document.title = "Présidentielles par commune";
    const ex = [["75056","Paris"],["13055","Marseille"],["69123","Lyon"],["74010","Annecy"],["59350","Lille"],["2A004","Ajaccio"]];
    out.innerHTML = '<div class="chips"><span class="chips-l">Essayez par exemple :</span>' + ex.filter(e => byCode.has(e[0]))
      .map(e => '<button class="chip" data-c="'+e[0]+'">'+e[1]+'</button>').join("") + '</div>';
    out.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => location.hash = b.dataset.c));
    setFoot();
  }

  function route(){
    const code = decodeURIComponent(location.hash.slice(1));
    if(code && byCode.has(code)){ const c = byCode.get(code); if(document.activeElement !== q){ q.value = c.name; clear.hidden = false; } show(code); }
    else welcome();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
